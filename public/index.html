<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYLR</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a1128;
            --bg-card: #1c2541;
            --accent: #00b4d8;
            --text-main: #f8f9fa;
            --text-muted: #8d99ae;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        nav {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            background: rgba(28, 37, 65, 0.5);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-btn {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--text-main);
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .nav-btn.active, .nav-btn:hover {
            background: var(--accent);
            color: var(--bg-primary);
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.4);
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
        }

        .page {
            display: none;
            animation: fadeIn 0.5s ease-in-out forwards;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .avatar-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid var(--accent);
            box-shadow: 0 0 20px rgba(0, 180, 216, 0.3);
            margin-bottom: 20px;
            object-fit: cover;
        }

        .profile-name {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .bio-text {
            color: var(--text-muted);
            line-height: 1.8;
            font-size: 1.1rem;
            margin-top: 15px;
        }

        .accounts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .account-card {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
            text-decoration: none;
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }

        .account-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 5px 20px rgba(0, 180, 216, 0.2);
        }

        .account-icon {
            font-size: 2.2rem;
            color: var(--accent);
        }

        .account-info h3 {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .account-info p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <nav>
        <button class="nav-btn active" onclick="showPage('home')">الرئيسية</button>
        <button class="nav-btn" onclick="showPage('accounts')">حساباتي</button>
    </nav>

    <div class="container">
        <!-- الصفحة الرئيسية -->
        <div id="home" class="page active">
            <div class="card">
                <img src="https://i.postimg.cc/025DB3ZS/IMG-3293.jpg" alt="صورة شخصية" class="avatar-img">
                <h1 class="profile-name">KYLR | SAUD</h1>
                <p class="bio-text">
                    أهلاً بك في موقعي الشخصي! أنا مطور ومصمم شغوف بالتقنية وتطوير المواقع والبرامج. أستمتع بإنشاء تجارب رقمية مميزة وبناء مجتمعات تفاعلية.
                </p>
            </div>
        </div>

        <!-- صفحة حساباتي -->
        <div id="accounts" class="page">
            <div class="accounts-grid">
                <!-- تيك توك -->
                <a href="https://www.tiktok.com/@MS4wLjABAAAAh5MPhwIaeYbBFwC-hOkH2xt3GofH0UeQbVqJYcuNIgO3mu5Pp3vLVNJKEeW9nba0?_r=1&_t=ZS-9A1HcckjG8j" class="account-card" target="_blank">
                    <i class="fab fa-tiktok account-icon"></i>
                    <div class="account-info">
                        <h3>تيك توك</h3>
                        <p>تابعني على TikTok</p>
                    </div>
                </a>

                <!-- سناب شات -->
                <a href="https://snapchat.com/t/aHAc2LR2" class="account-card" target="_blank">
                    <i class="fab fa-snapchat account-icon"></i>
                    <div class="account-info">
                        <h3>سناب شات</h3>
                        <p>تواصل معي على Snapchat</p>
                    </div>
                </a>

                <!-- ديسكورد -->
                <a href="#" class="account-card" target="_blank">
                    <i class="fab fa-discord account-icon"></i>
                    <div class="account-info">
                        <h3>ديسكورد</h3>
                        <p>انضم لمجتمعي في Discord</p>
                    </div>
                </a>

                <!-- انستغرام -->
                <a href="https://www.instagram.com/kylr_10?stkn=ZXVidXl1czZlZHhx&utm_source=qr" class="account-card" target="_blank">
                    <i class="fab fa-instagram account-icon"></i>
                    <div class="account-info">
                        <h3>انستغرام</h3>
                        <p>@kylr_10</p>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <script>
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(pageId).classList.add('active');
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
